name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `stellar contract build` is required, not plain cargo: the Soroban
      # SDK's build script needs the spec-shaking handshake the Stellar CLI
      # performs, and fails on purpose without it.
      #
      # Pinned release asset instead of the install.sh script — that URL
      # serves an HTML error page, which `sh` rejects with a parse error.
      - name: Install Stellar CLI
        env:
          STL_VERSION: "28.1.0"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL --fail -o "$RUNNER_TEMP/stellar-cli.tar.gz" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STL_VERSION}/stellar-cli-${STL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$RUNNER_TEMP/stellar-cli.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/stellar" "$HOME/.local/bin/stellar"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Stellar CLI version
        run: stellar --version

      - name: Build WASM
        run: stellar contract build

      - name: Report artifact
        run: ls -la target/wasm32v1-none/release/*.wasm
